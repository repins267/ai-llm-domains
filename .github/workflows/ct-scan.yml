name: CT Log Scanner

# RETIRED 2026-08-28: CT discovery moved to the private ai-llm-domains-dev pipeline
# (scan -> classify -> human review -> promote), which filters provider infrastructure
# instead of blanket-stamping every subdomain. This workflow no longer runs on a schedule
# and no longer auto-opens PRs; kept manual-only (workflow_dispatch) for reference.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ct-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Scan CT logs
        id: scan
        run: |
          set +e
          python scripts/scan_ct_logs.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: No new domains
        if: steps.scan.outputs.exit_code == '0'
        run: echo "No new domains found — nothing to do."

      - name: Merge, commit, and open PR
        if: steps.scan.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MERGE_OUTPUT=$(python scripts/merge_discoveries.py)
          echo "$MERGE_OUTPUT"

          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto/ct-scan-${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add data/known_ai_domains.json
          git commit -m "auto: add CT-discovered domains (${DATE})"
          git push origin "${BRANCH}"

          # Create the label if it doesn't already exist
          gh label create "auto-discovered" \
            --color "0075ca" \
            --description "Auto-discovered by CT log scanner" || true

          # Write PR body to a temp file to avoid YAML/shell quoting issues
          cat > /tmp/pr_body.md << EOF
          ## CT Log Scan Results

          ${MERGE_OUTPUT}

          New subdomains were discovered via Certificate Transparency logs for known
          AI/LLM provider base domains (certificates issued in the last 7 days).

          **Review before merging:**
          - Verify the domains are genuinely AI/LLM related
          - Adjust the \`risk\` field if needed (default: \`medium\`)
          - Remove any false positives (CDN edges, internal endpoints, etc.)
          EOF

          gh pr create \
            --title "Auto: CT-discovered AI domains (${DATE})" \
            --body-file /tmp/pr_body.md \
            --label "auto-discovered" \
            --head "${BRANCH}" \
            --base "main"
